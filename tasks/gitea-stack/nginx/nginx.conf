
server {
    listen 80;
    server_name demidov-va;

    
    
    location  /git/ {
        proxy_pass http://gitea:3000/;
        include /etc/nginx/proxy.params;
    }

    location / {
        return 301 /git/;
    }
    location /hehe/ {
        root /usr/share/nginx/html;
        index index.html;
    }
}