---
- name: Lab 1 - idempotent playbook on localhost
  hosts: local
  gather_facts: true

  vars:
    lab_dir: /tmp/ansible_lab
    greeting: "Hello from {{ ansible_hostname }}"

  tasks:
    - name: Ensure lab directory exists
      ansible.builtin.file:
        path: "{{ lab_dir }}"
        state: directory
        mode: "0755"

    - name: Render a config file from template
      ansible.builtin.template:
        src: motd.j2
        dest: "{{ lab_dir }}/motd.txt"
        mode: "0644"
      notify: Show updated motd

    - name: Ensure a specific line is present in a file
      ansible.builtin.lineinfile:
        path: "{{ lab_dir }}/settings.conf"
        line: "ENV=lab"
        create: true
        mode: "0644"

    - name: Print a debug message
      ansible.builtin.debug:
        msg: "{{ greeting }} | distro: {{ ansible_distribution }} {{ ansible_distribution_major_version }}"

  handlers:
    - name: Show updated motd
      ansible.builtin.debug:
        msg: "motd was changed, handler fired"
